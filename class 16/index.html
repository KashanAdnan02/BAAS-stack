<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KFC Pakistan - Website</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="navbar">
      <div class="left">
        <img src="https://freesvg.org/img/menu-icon.png" class="menu" alt="" />
        <img src="download.png" alt="" class="logo" />
        <div class="delivery-btn btn">
          <img
            src="https://www.kfcpakistan.com/static/media/Delivery.793adbaa710baf75ba78.png"
            alt=""
          />
          <p>Delivery</p>
        </div>
        <div class="pickup btn">
          <img
            src="https://www.kfcpakistan.com/static/media/pickup.47bb874f83ea6acb5a47.png"
            alt=""
          />
          <p>PICKUP</p>
        </div>
        <div class="merch btn">
          <img
            src="https://www.kfcpakistan.com/static/media/kfc_merch_icon.2fbdafb9a4c96d69df4a.png"
            alt=""
          />
          <p>MERCH</p>
        </div>
      </div>
      <div class="right">
        <img
          src="https://cdn-icons-png.flaticon.com/512/4936/4936411.png"
          alt=""
        />
        <button>LOGIN</button>
      </div>
    </div>
  </body>
</html>
